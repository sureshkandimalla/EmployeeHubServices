# nginx's default client_max_body_size (1MB) rejects anything larger with a
# 413 before the request ever reaches the Spring app — this only ever
# mattered once a request started sending file bytes straight to our own
# backend instead of a presigned S3 URL (every other upload in this app
# bypasses nginx/Tomcat entirely that way). I9RecordController's PDF
# extraction endpoint is the first to send a real file body through nginx,
# so this limit was never hit before. Spring's own multipart limit
# (spring.servlet.multipart.max-file-size, application.properties) is
# already 10MB — this just needs to be at or above that so nginx isn't the
# tighter of the two.
client_max_body_size 15M;
