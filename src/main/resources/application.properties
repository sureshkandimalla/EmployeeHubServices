spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect

# Externalized tenant registry — see config.TenantRegistryProperties /
# DataSourceConfig / AuthController. To onboard a new company: create its
# database, add one app.tenants[N] block below (or the equivalent
# APP_TENANTS_<N>_* env vars on Elastic Beanstalk — Spring Boot's relaxed
# binding materializes new indices purely from env vars, no properties-file
# change needed), and restart. No Java change, no rebuild.
# Same DB_USERNAME/DB_PASSWORD above for every tenant; only the schema differs.
app.default-tenant=intellan

app.tenants[0].key=bean
app.tenants[0].domains[0]=beaninfosys.com
app.tenants[0].jdbc-url=${DB_URL_BEAN:jdbc:mysql://localhost:3306/Bean-prod?allowPublicKeyRetrieval=true&useSSL=false}

app.tenants[1].key=intellan
app.tenants[1].domains[0]=intellanit.com
app.tenants[1].domains[1]=intellan.com
app.tenants[1].jdbc-url=${DB_URL_INTELLAN:jdbc:mysql://localhost:3306/Intellan?allowPublicKeyRetrieval=true&useSSL=false}

app.tenants[2].key=kkassociates
app.tenants[2].domains[0]=kksoftwareassociates.com
app.tenants[2].emails[0]=mkasa123@gmail.com
app.tenants[2].jdbc-url=${DB_URL_KKASSOCIATES:jdbc:mysql://localhost:3306/KKAssociates?allowPublicKeyRetrieval=true&useSSL=false}

# Signs the app's own session token issued after Google login is verified
# server-side (see AuthController / JwtService) — must be set to a real
# secret in production; this default is local-dev only.
app.jwt-secret=${JWT_SECRET:local-dev-only-secret-change-me-1234567890}

# Extra allowed CORS origins beyond the localhost dev defaults baked into
# CorsConfig, e.g. the Vercel production URL — comma-separated, set at
# deploy time so adding an origin never needs a code change/rebuild.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4000,http://localhost:4200}

spring.jpa.hibernate.ddl-auto=update
springdoc.swagger-ui.operationsSorter=method
spring.main.allow-bean-definition-overriding=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update

spring.jpa.show-sql=false

# Format the SQL statements for readability
spring.jpa.properties.hibernate.format_sql=false

# Multipart file upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Company employee ID range reservations now live in
# com.employeehub.config.CompanyIdRangeConfig (space-containing keys here didn't
# bind reliably via @ConfigurationProperties Map binding).

# Email notifications (see EmailService / NotificationService) — sent via
# SMTP from a dedicated Google Workspace mailbox using an App Password (not
# the mailbox's real login password; Google requires this for SMTP auth).
# app.mail.enabled defaults to false so a dev/CI environment with no SMTP
# credentials configured never actually attempts to send — NotificationService
# logs and no-ops instead. Set EMAIL_NOTIFICATIONS_ENABLED=true once
# SMTP_USERNAME/SMTP_PASSWORD are real.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.mail.from=${SMTP_FROM_ADDRESS:${SMTP_USERNAME:}}
# How many days before a document's Valid Until date the scheduled
# expiration check first emails about it (see
# NotificationService#checkExpiringDocuments). A document is only emailed
# once (Document.expirationAlertSentAt), not every day it stays in-window.
app.mail.expiration-lead-days=${EXPIRATION_ALERT_LEAD_DAYS:30}